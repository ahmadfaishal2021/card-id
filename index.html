<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad Faishal - X ELIND 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        body {
            /* Warna latar belakang kuning cerah penuh sesuai gambar */
            background-color: #FFEA36;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .phone-wrapper {
            background-color: #FFEA36;
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            position: relative;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Sekolah di Pojok Kiri Atas */
        .school-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 75px;
            height: auto;
        }

        /* Avatar Profil Lingkaran Latar Hijau */
        .profile-container {
            margin-top: 60px;
            margin-bottom: 25px;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #84cc16; /* Warna hijau terang pada latar foto */
            object-fit: cover;
            display: block;
        }

        /* Bagian Teks Identitas */
        .info-container {
            text-align: center;
            margin-bottom: 35px;
        }

        .name {
            font-size: 1.6rem;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .class-name {
            font-size: 1.5rem;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Komponen Barcode / QR Code Tengah */
        .qr-container {
            background-color: #ffffff;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 50px;
            display: inline-block;
        }

        .qr-image {
            width: 180px;
            height: 180px;
            display: block;
        }

        /* Baris Tombol Media Sosial (Horizontal di Bawah) */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            margin-top: auto; /* Mendorong sosmed ke bagian bawah halaman */
            padding-bottom: 20px;
        }

        .social-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            text-decoration: none;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        /* Warna & Gaya Ikon Sosmed Mengikuti Gambar Resmi */
        .icon-youtube {
            background-color: #FF0000;
        }

        .icon-tiktok {
            background-color: #000000;
        }

        .icon-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* SVG Ikon Putih di Dalam Tombol */
        .social-icon svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <!-- Logo SMK Mitra Industri 03 (Ganti src dengan file logo Anda) -->
        <img class="school-logo" src="logo-smk.jpg" alt="Logo SMK">

        <!-- Foto Profil Lingkaran -->
        <div class="profile-container">
            <!-- Ganti src dengan file foto formal Anda -->
            <img class="avatar" src="foto-faishal.jpg" alt="Ahmad Faishal">
        </div>

        <!-- Nama dan Kelas -->
        <div class="info-container">
            <h1 class="name">AHMAD FAISHAL</h1>
            <h2 class="class-name">X ELIND 3</h2>
        </div>

        <!-- Kode Barcode / QRIS -->
        <div class="qr-container">
            <!-- Ganti src dengan file QR Code milik Anda -->
            <img class="qr-image" src="qris.jpg" alt="QR Code">
        </div>

        <!-- Baris Media Sosial Horizontal -->
        <div class="social-row">

    </div>

</body>
</html>
